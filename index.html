<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaDev Market</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0f19;
  color: white;
  min-height: 100vh;
}

header {
  padding: 25px 18px;
  text-align: center;
}

.logo {
  color: #22c55e;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 10px;
}

.subtitle {
  color: #9ca3af;
  font-size: 13px;
}

.search-box {
  margin: 30px auto;
  max-width: 500px;
  padding: 0 18px;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #374151;
  border-radius: 12px;
  background: #1f2937;
  color: white;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #22c55e;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 0 18px;
}

#results {
  display: none;
}

h2 {
  font-size: 18px;
  margin-bottom: 15px;
}

.game {
  background: #151e2e;
  border: 1px solid #29364b;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  cursor: pointer;
}

.game:hover {
  border-color: #22c55e;
}

.game-name {
  font-weight: bold;
}

.game-info {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 5px;
}

#message {
  color: #9ca3af;
  text-align: center;
  font-size: 13px;
  margin-top: 15px;
}

#selected-game {
  display: none;
  margin-top: 25px;
  background: #151e2e;
  border: 1px solid #29364b;
  border-radius: 12px;
  padding: 20px;
}

.categories {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.category {
  padding: 14px;
  background: #1f2937;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

.category:hover {
  background: #22c55e;
  color: black;
}
</style>
</head>

<body>

<header>
  <div class="logo">NovaDev Market 🛒</div>
  <div class="subtitle">
    Cari game Roblox untuk melihat marketplace
  </div>
</header>

<div class="search-box">
  <input
    type="text"
    id="search"
    placeholder="Cari nama game..."
    autocomplete="off"
  >
</div>

<main>
  <div id="results">
    <h2>Game ditemukan</h2>
    <div id="game-list"></div>
  </div>

  <div id="message">
    Ketik minimal 3 huruf untuk mencari game.
  </div>

  <div id="selected-game">
    <h2 id="selected-name"></h2>
    <p class="game-info">
      Pilih kategori yang ingin kamu cari.
    </p>

    <div class="categories">
      <button class="category">Akun</button>
      <button class="category">Joki</button>
      <button class="category">Item</button>
      <button class="category">Gamepass</button>
    </div>
  </div>
</main>

<script>
const games = [
  "Blox Fruits",
  "Grow a Garden",
  "Fisch",
  "Brookhaven"
];

const search = document.getElementById("search");
const results = document.getElementById("results");
const gameList = document.getElementById("game-list");
const message = document.getElementById("message");
const selectedGame = document.getElementById("selected-game");
const selectedName = document.getElementById("selected-name");

search.addEventListener("input", function() {
  const keyword = search.value.trim().toLowerCase();

  selectedGame.style.display = "none";

  if (keyword.length < 3) {
    results.style.display = "none";
    message.style.display = "block";
    message.textContent =
      "Ketik minimal 3 huruf untuk mencari game.";
    return;
  }

  const found = games.filter(game =>
    game.toLowerCase().includes(keyword)
  );

  results.style.display = "block";

  if (found.length === 0) {
    gameList.innerHTML = "";
    message.style.display = "block";
    message.textContent = "Game tidak ditemukan.";
    return;
  }

  message.style.display = "none";

  gameList.innerHTML = found.map(game => `
    <div class="game" onclick="chooseGame('${game}')">
      <div class="game-name">${game}</div>
      <div class="game-info">Roblox Game</div>
    </div>
  `).join("");
});

function chooseGame(game) {
  selectedName.textContent = game;
  selectedGame.style.display = "block";
  results.style.display = "none";
  message.style.display = "none";
}
</script>

</body>
</html>
