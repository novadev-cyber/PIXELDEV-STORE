<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaDev Market</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #080c14;
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 45px 20px 25px;
}

.logo {
  color: #22e879;
  font-size: 28px;
  font-weight: bold;
}

.subtitle {
  color: #8d99ab;
  font-size: 13px;
  margin-top: 10px;
}

.search-area {
  max-width: 560px;
  margin: 20px auto;
  padding: 0 20px;
}

#search {
  width: 100%;
  padding: 17px;
  border: 1px solid #303d52;
  border-radius: 12px;
  background: #151e2d;
  color: white;
  font-size: 15px;
  outline: none;
}

#search:focus {
  border-color: #22e879;
}

main {
  max-width: 560px;
  margin: auto;
  padding: 0 20px 40px;
}

#results,
#categories {
  display: none;
}

.heading {
  font-size: 18px;
  margin: 25px 0 15px;
}

.game-card {
  background: #151e2d;
  border: 1px solid #303d52;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 10px;
  cursor: pointer;
}

.game-card:hover {
  border-color: #22e879;
  background: #1c293b;
}

.game-name {
  font-size: 16px;
  font-weight: bold;
}

.game-type {
  color: #8d99ab;
  font-size: 12px;
  margin-top: 5px;
}

#message {
  color: #8d99ab;
  font-size: 13px;
  text-align: center;
  margin-top: 25px;
}

.selected-title {
  color: #22e879;
  font-size: 22px;
  margin-bottom: 8px;
}

.back {
  background: transparent;
  border: 1px solid #39465b;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  margin-top: 20px;
  cursor: pointer;
}

.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.category-card {
  background: #151e2d;
  border: 1px solid #303d52;
  border-radius: 12px;
  padding: 22px 10px;
  text-align: center;
  color: white;
  cursor: pointer;
}

.category-card:hover {
  border-color: #22e879;
}

.category-icon {
  font-size: 30px;
  margin-bottom: 10px;
}

.category-name {
  font-weight: bold;
}

#category-message {
  color: #8d99ab;
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NovaDev Market 🛒</div>
  <div class="subtitle">
    Cari game Roblox untuk mulai berbelanja
  </div>
</header>

<div class="search-area">
  <input
    id="search"
    type="text"
    placeholder="Cari nama game..."
    autocomplete="off"
  >
</div>

<main>

  <div id="message">
    Ketik minimal 3 huruf untuk mencari game.
  </div>

  <section id="results">
    <h2 class="heading">Game Ditemukan</h2>
    <div id="game-list"></div>
  </section>

  <section id="categories">
    <button class="back" onclick="goBack()">← Kembali</button>

    <h2 class="heading selected-title" id="selected-game"></h2>

    <p class="game-type" style="margin-bottom:18px;">
      Pilih kategori produk
    </p>

    <div class="category-grid">
      <button class="category-card" onclick="chooseCategory('Akun')">
        <div class="category-icon">👤</div>
        <div class="category-name">Akun</div>
      </button>

      <button class="category-card" onclick="chooseCategory('Joki')">
        <div class="category-icon">⚔️</div>
        <div class="category-name">Joki</div>
      </button>

      <button class="category-card" onclick="chooseCategory('Item')">
        <div class="category-icon">🎁</div>
        <div class="category-name">Item</div>
      </button>

      <button class="category-card" onclick="chooseCategory('Gamepass')">
        <div class="category-icon">🎟️</div>
        <div class="category-name">Gamepass</div>
      </button>
    </div>

    <div id="category-message"></div>
  </section>

</main>

<script>
const games = [
  "Blox Fruits",
  "Grow a Garden",
  "Fisch",
  "Brookhaven"
];

const searchInput = document.getElementById("search");
const message = document.getElementById("message");
const results = document.getElementById("results");
const gameList = document.getElementById("game-list");
const categories = document.getElementById("categories");
const selectedGame = document.getElementById("selected-game");
const categoryMessage = document.getElementById("category-message");

let activeGame = "";

searchInput.addEventListener("input", function() {
  const keyword = searchInput.value.trim().toLowerCase();

  categories.style.display = "none";
  categoryMessage.textContent = "";

  if (keyword.length < 3) {
    results.style.display = "none";
    message.style.display = "block";
    message.textContent =
      "Ketik minimal 3 huruf untuk mencari game.";
    return;
  }

  const foundGames = games.filter(game =>
    game.toLowerCase().includes(keyword)
  );

  results.style.display = "block";

  if (foundGames.length === 0) {
    gameList.innerHTML = "";
    message.style.display = "block";
    message.textContent = "Game tidak ditemukan.";
    return;
  }

  message.style.display = "none";

  gameList.innerHTML = foundGames.map(game => `
    <div class="game-card" onclick="selectGame('${game}')">
      <div class="game-name">${game}</div>
      <div class="game-type">Roblox Game</div>
    </div>
  `).join("");
});

function selectGame(game) {
  activeGame = game;

  selectedGame.textContent = game;
  results.style.display = "none";
  categories.style.display = "block";
  message.style.display = "none";
}

function goBack() {
  categories.style.display = "none";
  results.style.display = "block";
  message.style.display = "none";
  categoryMessage.textContent = "";
}

function chooseCategory(category) {
  categoryMessage.textContent =
    "Kategori " + category +
    " untuk " + activeGame +
    ". Produk akan ditampilkan pada langkah berikutnya.";
}
</script>

</body>
</html>
